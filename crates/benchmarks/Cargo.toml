[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
usearch = "2.10"
lance = "0.15"
rand = "0.8"
criterion = "0.5"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ann_benchmark"
path = "src/ann_comparison.rs"
