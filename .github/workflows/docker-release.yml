name: Docker Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/search
      build-args: |
        COMMIT_SHA=${{ github.sha }}
        COMMIT_DATE=${{ github.event.head_commit.timestamp }}
        GIT_TAG=${{ github.ref_name }}
        EXTRA_ARGS=
    secrets: inherit
