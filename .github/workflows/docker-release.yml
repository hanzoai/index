# GitHub is a mirror; it no longer builds or pushes the app image.
on:
  workflow_dispatch:
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "native pipeline is .hanzo/workflows/deploy.yml; GitHub is a mirror"
