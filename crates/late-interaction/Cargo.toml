[package]
name = "late-interaction"
version = "0.1.0"
edition = "2021"
authors = ["Hanzo AI Contributors"]
description = "Late-interaction (ColBERTv2/PLAID) retrieval operators and compressed indexes"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bytemuck = "1.14"
num-traits = "0.2"
rayon = "1.8"
aligned-vec = "0.5"

[dev-dependencies]
criterion = "0.5"

[features]
default = ["avx2"]
avx2 = []
