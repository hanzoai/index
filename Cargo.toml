[workspace]
resolver = "2"
members = [
    "crates/meilisearch",
    "crates/meilitool",
    "crates/meilisearch-types",
    "crates/meilisearch-auth",
    "crates/meili-snap",
    "crates/index-scheduler",
    "crates/dump",
    "crates/file-store",
    "crates/permissive-json-pointer",
    "crates/milli",
    "crates/filter-parser",
    "crates/flatten-serde-json",
    "crates/json-depth-checker",
    "crates/fuzzers",
    "crates/tracing-trace",
    "crates/xtask",
    "crates/build-info",
    "crates/openapi-generator",
    "crates/http-client",
    "crates/routes-macros",
    "crates/routes",
    "external-crates/async-openai",
    "external-crates/async-openai-macros",
]

[workspace.package]
version = "1.45.2"
authors = [
    "Hanzo AI <dev@hanzo.ai>",
]
description = "Hanzo Search -- lightning-fast search engine for AI workloads"
homepage = "https://hanzo.ai"
repository = "https://github.com/hanzoai/search"
readme = "README.md"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mimalloc = { version = "0.1.48", default-features = false, features = ["v3", "override"] }

[profile.release]
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true

# We now compile heed without the NDEBUG define for better performance.
# However, we still enable debug assertions for a better detection of
# disk corruption on the cloud or in OSS.
[profile.release.package.heed]
debug-assertions = true

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.grenad]
opt-level = 3
[profile.dev.package.roaring]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
